<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiveMQ MQTT Test</title>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #cbd5e1;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        #connectBtn {
            background: #22c55e;
            color: #052e16;
        }

        #disconnectBtn {
            background: #ef4444;
            color: white;
        }

        #publishBtn {
            background: #3b82f6;
            color: white;
        }

        #clearBtn {
            background: #475569;
            color: white;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            background: #334155;
        }

        .connected {
            background: #14532d;
            color: #86efac;
        }

        .disconnected {
            background: #7f1d1d;
            color: #fecaca;
        }

        .log {
            background: #020617;
            border-radius: 10px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }

        .message {
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .info {
            color: #60a5fa;
        }

        .received {
            color: #facc15;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 HiveMQ MQTT Tester</h1>
    <div class="subtitle">
        Centre Performance Lab — MQTT Connection Test
    </div>

    <!-- CONNECTION -->
    <div class="card">

        <h2>1. Connect to HiveMQ</h2>

        <label>HiveMQ Host</label>
        <input
            id="host"
            value="eedd8d46186c44a28d4a38dcefb6d4f8.s1.eu.hivemq.cloud"
        >

        <label>WebSocket Port</label>
        <input
            id="port"
            value="8884"
        >

        <label>WebSocket Path</label>
        <input
            id="path"
            value="/mqtt"
        >

        <label>Username</label>
        <input
            id="username"
            value="hellojannu"
        >

        <label>Password</label>
        <input
            id="password"
            type="password"
            placeholder="Enter your HiveMQ password"
        >

        <button id="connectBtn">
            🔌 Connect
        </button>

        <button id="disconnectBtn" disabled>
            ❌ Disconnect
        </button>

        <div id="status" class="status">
            ⚪ Not connected
        </div>

    </div>


    <!-- PUBLISH -->
    <div class="card">

        <h2>2. Send Message</h2>

        <label>Topic</label>
        <input
            id="publishTopic"
            value="centre/test"
        >

        <label>Message</label>

        <textarea id="message">Hello from Centre Performance Lab! 🚀</textarea>

        <button id="publishBtn" disabled>
            📤 Publish Message
        </button>

    </div>


    <!-- SUBSCRIBE -->
    <div class="card">

        <h2>3. Subscribe</h2>

        <label>Topic to Subscribe</label>

        <input
            id="subscribeTopic"
            value="centre/test"
        >

        <button id="subscribeBtn" disabled>
            📡 Subscribe
        </button>

    </div>


    <!-- LOG -->
    <div class="card">

        <h2>📡 MQTT Log</h2>

        <div id="log" class="log"></div>

        <button id="clearBtn">
            🗑 Clear Log
        </button>

    </div>

</div>


<script>

let client = null;


/* -------------------------
   LOG
------------------------- */

function log(message, type = "info") {

    const logBox = document.getElementById("log");

    const div = document.createElement("div");

    div.className = "message " + type;

    const time = new Date().toLocaleTimeString();

    div.textContent = `[${time}] ${message}`;

    logBox.appendChild(div);

    logBox.scrollTop = logBox.scrollHeight;
}


/* -------------------------
   STATUS
------------------------- */

function setStatus(message, connected = false) {

    const status = document.getElementById("status");

    status.textContent = message;

    status.className =
        connected
        ? "status connected"
        : "status disconnected";

}


/* -------------------------
   CONNECT
------------------------- */

document.getElementById("connectBtn").onclick = function () {

    const host =
        document.getElementById("host").value.trim();

    const port =
        document.getElementById("port").value.trim();

    const path =
        document.getElementById("path").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (!password) {

        alert("Enter your HiveMQ password first.");

        return;
    }


    const url =
        `wss://${host}:${port}${path}`;


    log("Connecting to:");
    log(url);


    setStatus("🟡 Connecting...", false);


    client = mqtt.connect(url, {

        username: username,

        password: password,

        protocol: "wss",

        clean: true,

        reconnectPeriod: 3000,

        connectTimeout: 10000,

        clientId:
            "centre-web-" +
            Math.random()
                .toString(16)
                .substring(2)

    });


    /* CONNECTED */

    client.on("connect", function () {

        log(
            "CONNECTED TO HIVEMQ SUCCESSFULLY! 🎉",
            "success"
        );

        setStatus(
            "🟢 Connected to HiveMQ",
            true
        );


        document.getElementById("connectBtn")
            .disabled = true;

        document.getElementById("disconnectBtn")
            .disabled = false;

        document.getElementById("publishBtn")
            .disabled = false;

        document.getElementById("subscribeBtn")
            .disabled = false;

    });


    /* MESSAGE */

    client.on("message", function (topic, message) {

        const text =
            message.toString();

        log(
            `📥 RECEIVED | ${topic} | ${text}`,
            "received"
        );

    });


    /* ERROR */

    client.on("error", function (error) {

        console.error(error);

        log(
            "MQTT ERROR: " + error.message,
            "error"
        );

        setStatus(
            "🔴 Connection Error",
            false
        );

    });


    /* DISCONNECT */

    client.on("close", function () {

        log(
            "Disconnected from HiveMQ.",
            "error"
        );

        setStatus(
            "🔴 Disconnected",
            false
        );

        document.getElementById("connectBtn")
            .disabled = false;

        document.getElementById("disconnectBtn")
            .disabled = true;

        document.getElementById("publishBtn")
            .disabled = true;

        document.getElementById("subscribeBtn")
            .disabled = true;

    });


    /* RECONNECT */

    client.on("reconnect", function () {

        log(
            "Attempting to reconnect..."
        );

        setStatus(
            "🟡 Reconnecting...",
            false
        );

    });

};


/* -------------------------
   DISCONNECT
------------------------- */

document.getElementById("disconnectBtn").onclick = function () {

    if (client) {

        client.end();

        log(
            "Disconnected manually."
        );

    }

};


/* -------------------------
   SUBSCRIBE
------------------------- */

document.getElementById("subscribeBtn").onclick = function () {

    const topic =
        document.getElementById("subscribeTopic")
            .value.trim();

    if (!topic) {

        alert("Enter a topic.");

        return;
    }


    client.subscribe(topic, function (error) {

        if (error) {

            log(
                "Subscribe error: " + error.message,
                "error"
            );

            return;
        }


        log(
            `SUBSCRIBED TO: ${topic}`,
            "success"
        );

    });

};


/* -------------------------
   PUBLISH
------------------------- */

document.getElementById("publishBtn").onclick = function () {

    const topic =
        document.getElementById("publishTopic")
            .value.trim();

    const message =
        document.getElementById("message")
            .value;


    if (!topic) {

        alert("Enter a topic.");

        return;
    }


    client.publish(
        topic,
        message,
        {
            qos: 0,
            retain: false
        },
        function (error) {

            if (error) {

                log(
                    "Publish error: " +
                    error.message,
                    "error"
                );

            } else {

                log(
                    `📤 SENT | ${topic} | ${message}`,
                    "success"
                );

            }

        }
    );

};


/* -------------------------
   CLEAR LOG
------------------------- */

document.getElementById("clearBtn").onclick = function () {

    document.getElementById("log").innerHTML = "";

};


log("MQTT tester loaded.");
log("Enter your HiveMQ password and click Connect.");

</script>

</body>
</html>
